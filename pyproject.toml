[project]
name = "nice-ass-captions"
version = "0.1.0"
description = "Burn stylish captions into videos using whisper and ffmpeg. Runs locally. Powered by ASS™"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/zeke/nice-ass-captions"

[project.scripts]
caption = "caption:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["caption.py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep it light: pyflakes (F) + the safe pycodestyle error subset + import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
